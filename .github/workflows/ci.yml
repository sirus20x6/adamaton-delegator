name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-delegator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Self-hosted only: hosted runners are billing-blocked for this account.
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          path: delegator
      # Siblings required by the relative `replace ../../<repo>` lines in
      # delegator/go.mod and mcp/go.mod. Only core and platform/temporal are
      # actually in the module graph; the other replace targets are never
      # resolved so they don't need checkouts. GITHUB_TOKEN is repo-scoped
      # and cannot read the private sibling repos, so clone with the
      # self-hosted runner user's own SSH credentials instead.
      - name: checkout siblings (private repos)
        run: |
          rm -rf core platform
          git clone --depth 1 git@github.com:sirus20x6/adamaton-core.git core
          git clone --depth 1 git@github.com:sirus20x6/adamaton-platform.git platform
      - name: vet, build, and test all modules
        env:
          GOGENTS_SKIP_DOCKER_TESTS: "1"
          GOFLAGS: -mod=mod
        run: |
          cd delegator
          find . -name go.mod -not -path '*/vendor/*' | while read -r m; do
            d=$(dirname "$m")
            echo "== $d"
            (cd "$d" && GOWORK=off go vet ./... && GOWORK=off go build ./... && GOWORK=off go test ./...) || exit 1
          done
